spring:
  application:
    name: practice

  messages:
    encoding: UTF-8
    basename: messages

  datasource:
    url: jdbc:postgresql://localhost:5432/taskdb
    username: postgres
    password: batool
    driver-class-name: org.postgresql.Driver


  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-for-jwt-signing-should-be-long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# If set, registering with role ADMIN requires header X-Admin-Register-Secret with this value.
# Leave empty to disallow ADMIN self-registration via /auth/register.
app:
  admin-register-secret: superSecret123
server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
